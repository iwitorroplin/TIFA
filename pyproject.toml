[project]
name = "tifa"
version = "0.1.0"
description = "TIFA"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.11,<7",
    "PyYAML>=6.0,<7",
    "pdfplumber>=0.11,<1",
    # Servidor web (web/), proceso aparte de la app de escritorio: ver web/__init__.py.
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "jinja2>=3.1,<4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
