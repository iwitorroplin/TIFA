# Ruta relativa a la carpeta del propio programa (se resuelve contra ella
# mientras no sea absoluta). Es solo el punto de partida del primer arranque:
# se edita desde la pestaña de Configuración con las rutas reales.
local_root: "data/steriflow/local"
server_root: "data/steriflow/server"
execution_hours: [
  "05:00",
  "08:00",
  "12:00",
  "16:00",
  "20:00"
  ]

# columns.visible: claves de columnas opcionales activas en la tabla de
# ciclos de esterilización (pantalla e impresión comparten esta lista). Las
# columnas fijas (Autoclave, Producto, Duración esterilización, T media,
# Revisión) no se listan aquí: se ven siempre.
columns:
  visible:
    - started_at
    - cycle_number
    - phase
    - sterilization_start_ts
    - sterilization_end_ts
    - temp_min
    - temp_max

auto_enabled: false

# code: numero real de la autoclave, el que se guarda con cada ciclo.
# report_code: el que la maquina imprime en sus PDF ("Cod. Autoclave"). Solo
# hace falta escribirlo cuando NO coincide con code, como en la AUTOCLAVE8,
# que imprime 10 por un error historico que no se puede corregir en los
# informes ya emitidos.
local_root: C:\Report_MPI
server_root: R:\TRAZABILIDAD\backup_TIFA
execution_hours:
- 00:00
- 05:00
- 08:00
- '12:00'
- '16:00'
- '20:00'
auto_enabled: true
autoclaves:
- name: AUTOCLAVE6
  ip: 10.109.1.191
  code: 6
  report_code: 6
  path_folder: \\AUTOCLAVE6\Export
  local_folder: C:/Report_MPI/AUTOCLAVE6
  backup_folder: R:/TRAZABILIDAD/backup_TIFA/AUTOCLAVE6
  active: true
