app:
  name: TIFA
  description: Thermal Integration & F₀ Analysis
  version: "0.1.0"
  language: es
  theme: system

ui:
  dateFormat: "dd/MM/yyyy"
  timeFormat: "HH:mm:ss"

logs:
  # Los logs son el historial de la app (pestaña Logs): al arrancar se
  # borran los que pasen de esta antigüedad. 0 = no borrar nunca.
  # Se edita desde la pestaña Configuración.
  retentionMonths: 12
