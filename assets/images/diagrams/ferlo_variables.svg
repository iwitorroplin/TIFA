      .dg-win{stroke:#7C8892;stroke-width:1;stroke-dasharray:2 2;fill:none}
      .dg-label{fill:#525E69;font-family:"JetBrains Mono",ui-monospace,Consolas,monospace;font-size:11px}
      .dg-small{fill:#7C8892;font-family:"JetBrains Mono",ui-monospace,Consolas,monospace;font-size:10px}
      .dg-strong{fill:#111820;font-family:"Chivo","Helvetica Neue",Arial,sans-serif;font-size:12px;font-weight:600}
      .dg-sec{fill:#8C3915;font-family:"Chivo","Helvetica Neue",Arial,sans-serif;font-size:11px;font-weight:600;letter-spacing:.05em}
      .dg-frame{fill:#E3E7EB;stroke:#C0C8D0;stroke-width:1}
      .dg-box{fill:#FFFFFF;stroke:#C0C8D0;stroke-width:1}
      .dg-arrow{stroke:#7C8892;stroke-width:1.2;fill:none}
      .dg-head{fill:#7C8892}
      .dg-phase{fill:#C0C8D0}
      .dg-phase-a{fill:#B44A1E;opacity:.8}
      .dg-stab{fill:#8C3915;opacity:.35}
    </style>
</defs>
<rect x="0" y="0" width="900" height="660" fill="#FFFFFF"></rect>
<g><line class="dg-axis" x1="60" y1="40" x2="60" y2="320"></line>
<line class="dg-axis" x1="60" y1="320" x2="540" y2="320"></line>
