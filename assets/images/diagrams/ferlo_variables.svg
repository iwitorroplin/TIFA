<line class="dg-guide" x1="469" y1="570" x2="644" y2="570"></line>
<text class="dg-label" x="556.5" y="586" text-anchor="middle">suelo de la meseta</text>
<text class="dg-small" x="556.5" y="600" text-anchor="middle">por debajo: rampa/enfriam.</text>
<text class="dg-small" x="556.5" y="642" text-anchor="middle">moda solo cuenta ≥ suelo</text></g>
<g><rect class="dg-box" x="671" y="430" width="205" height="220" rx="3"></rect>
<text class="dg-strong" x="683" y="452">Aceptación y revisión</text>
<text class="dg-small" x="683" y="466">acceptance_tolerance_c</text>
<text class="dg-small" x="683" y="478">acceptance_time_tolerance_min</text>
<text class="dg-small" x="683" y="490">review_deviation_c</text>
<line class="dg-axis" x1="731" y1="516" x2="731" y2="606"></line>
<text class="dg-small" x="737" y="512">consigna</text>
<line class="dg-band" x1="719" y1="550" x2="743" y2="550"></line>
<text class="dg-small" x="749" y="553">banda esteriliz.</text>
<line class="dg-guide" x1="719" y1="572" x2="743" y2="572"></line>
<text class="dg-small" x="749" y="575">toler. aceptación</text>
<line class="dg-guide" x1="719" y1="594" x2="743" y2="594"></line>
