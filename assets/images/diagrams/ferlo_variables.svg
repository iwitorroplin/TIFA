<rect class="dg-win" x="770" y="263.1" width="20" height="36.9"></rect>
<polyline class="dg-curve" points="580,240.9 680,244.6 740,240.9 760,251.9 770,263.1 775,274.2 780,277.9 785,263.1 790,251.9 800,244.6 880,240.9"></polyline>
<line class="dg-arrow" x1="712" y1="288" x2="766" y2="283" marker-end="url(#ah)"></line>
<text class="dg-small" x="585" y="285">bajada de 45 s</text>
<text class="dg-small" x="585" y="298">&lt; antirrebote de salida (60 s)</text>
<text class="dg-label" x="795" y="291">no cierra la fase</text></g>
<line x1="20" y1="392" x2="880" y2="392" stroke="#D8DDE2" stroke-width="1"></line>
<text class="dg-sec" x="20" y="412">MUESTREO, VALIDEZ, CONSIGNA Y ACEPTACIÓN</text>
<g><rect class="dg-box" x="20" y="430" width="205" height="220" rx="3"></rect>
<text class="dg-strong" x="32" y="452">Muestreo</text>
<text class="dg-small" x="32" y="466">nominal_sample_interval_s</text>
<line class="dg-axis" x1="35" y1="540" x2="210" y2="540"></line>
<line class="dg-set" x1="35.0" y1="534" x2="35.0" y2="546"></line>
<line class="dg-set" x1="70.0" y1="534" x2="70.0" y2="546"></line>
<line class="dg-set" x1="105.0" y1="534" x2="105.0" y2="546"></line>
<line class="dg-set" x1="140.0" y1="534" x2="140.0" y2="546"></line>
<line class="dg-set" x1="175.0" y1="534" x2="175.0" y2="546"></line>
<line class="dg-set" x1="210.0" y1="534" x2="210.0" y2="546"></line>
<text class="dg-label" x="122.5" y="566" text-anchor="middle">cada 5 s, por defecto</text>
<text class="dg-small" x="122.5" y="582" text-anchor="middle">(1–300 s configurable)</text>
<text class="dg-small" x="122.5" y="630" text-anchor="middle">marca el hueco esperado</text>
<text class="dg-small" x="122.5" y="642" text-anchor="middle">entre lecturas consecutivas</text></g>
<g><rect class="dg-box" x="237" y="430" width="205" height="220" rx="3"></rect>
<text class="dg-strong" x="249" y="452">Validez del ciclo</text>
<text class="dg-small" x="249" y="466">min_cycle_duration_min</text>
<text class="dg-small" x="249" y="478">min_cycle_peak_temperature_c</text>
<line class="dg-guide" x1="249" y1="500" x2="430" y2="500"></line>
<text class="dg-label" x="252" y="496">pico mínimo · 60 °C</text>
<polyline class="dg-curve-thin" points="257,585 292,486 322,484 352,486 372,585"></polyline>
<line class="dg-set" x1="257" y1="599" x2="372" y2="599"></line>
<line class="dg-set" x1="257" y1="595" x2="257" y2="603"></line>
<line class="dg-set" x1="372" y1="595" x2="372" y2="603"></line>
<text class="dg-small" x="314.5" y="615" text-anchor="middle">≥ duración mínima</text>
<polyline class="dg-curve-off" points="397,585 415,522 433,585"></polyline>
<text class="dg-small" x="415.0" y="615" text-anchor="middle">descartado</text>
<line class="dg-axis" x1="249" y1="585" x2="430" y2="585"></line>
<text class="dg-small" x="339.5" y="630" text-anchor="middle">si no llega a ambos,</text>
<text class="dg-small" x="339.5" y="642" text-anchor="middle">se descarta como ruido</text></g>
<g><rect class="dg-box" x="454" y="430" width="205" height="220" rx="3"></rect>
<text class="dg-strong" x="466" y="452">Consigna por moda</text>
<text class="dg-small" x="466" y="466">setpoint_mode_bin_c</text>
<text class="dg-small" x="466" y="478">setpoint_mode_floor_c</text>
<polyline class="dg-curve-thin" points="469,518 489,510 514,515 539,508 564,514 589,509 644,516"></polyline>
<line class="dg-guide" x1="469.0" y1="498" x2="469.0" y2="526"></line>
<line class="dg-guide" x1="488.4" y1="498" x2="488.4" y2="526"></line>
<line class="dg-guide" x1="507.9" y1="498" x2="507.9" y2="526"></line>
<line class="dg-guide" x1="527.3" y1="498" x2="527.3" y2="526"></line>
<line class="dg-band" x1="546.8" y1="498" x2="546.8" y2="526"></line>
<line class="dg-guide" x1="566.2" y1="498" x2="566.2" y2="526"></line>
<line class="dg-guide" x1="585.7" y1="498" x2="585.7" y2="526"></line>
<line class="dg-guide" x1="605.1" y1="498" x2="605.1" y2="526"></line>
<line class="dg-guide" x1="624.6" y1="498" x2="624.6" y2="526"></line>
<line class="dg-guide" x1="644.0" y1="498" x2="644.0" y2="526"></line>
