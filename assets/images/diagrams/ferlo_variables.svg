<text class="dg-label" x="210" y="99" text-anchor="middle">meseta por moda: 117 °C</text>
<text class="dg-small" x="210" y="112" text-anchor="middle">844 muestras aquí, 4 en el pico</text>
<rect class="dg-stab" x="135.2" y="330" width="41.8" height="6"></rect>
<line class="dg-guide" x1="135.2" y1="330" x2="135.2" y2="235"></line>
<line class="dg-guide" x1="177.0" y1="330" x2="177.0" y2="235"></line>
<text class="dg-label" x="156.1" y="222" text-anchor="middle">ventana de estabilización · 10 min</text>
<rect class="dg-phase" x="101.8" y="330" width="33.4" height="6"></rect>
<rect class="dg-phase-a" x="135.2" y="330" width="313.5" height="6"></rect>
<rect class="dg-phase" x="448.7" y="330" width="46" height="6"></rect>
<text class="dg-small" x="118" y="352" text-anchor="middle">rampa</text>
<text class="dg-label" x="292" y="352" text-anchor="middle">esterilización · 75 min</text>
<text class="dg-small" x="471" y="352" text-anchor="middle">enfriam.</text>
<rect class="dg-win" x="248.1" y="48.9" width="62.7" height="19.1"></rect>
<line class="dg-guide" x1="310.8" y1="48.9" x2="575" y2="55"></line>
<line class="dg-guide" x1="310.8" y1="68" x2="575" y2="305"></line>
<rect class="dg-frame" x="575" y="55" width="310" height="250"></rect>
<text class="dg-strong" x="585" y="74">Meseta, minutos 45–60</text>
<line class="dg-set" x1="580" y1="244.6" x2="880" y2="244.6"></line>
<text class="dg-small" x="876" y="240" text-anchor="end">consigna 117,0 °C</text>
<line class="dg-band" x1="580" y1="263.1" x2="880" y2="263.1"></line>
