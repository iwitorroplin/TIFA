<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" role="img" aria-label="Diagrama de las variables de Configuracion de Ferlo: arriba, la curva de un ciclo de esterilizacion con el umbral de ciclo, la consigna estimada por moda de la meseta, la banda de tolerancia, el antirrebote de salida y la ventana de estabilizacion; abajo, cuatro paneles que explican el muestreo, los criterios de validez del ciclo, la resolucion y el suelo usados para estimar la consigna, y las tolerancias de aceptacion y revision.">
<defs>
<marker id="ah" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="5" orient="auto"><polygon class="dg-head" points="0,0 8,3 0,6"></polygon></marker>
<style>
      .dg-axis{stroke:#C0C8D0;stroke-width:1;fill:none}
      .dg-guide{stroke:#C0C8D0;stroke-width:1;stroke-dasharray:3 3;fill:none}
      .dg-curve{stroke:#B44A1E;stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}
      .dg-curve-thin{stroke:#B44A1E;stroke-width:1.4;fill:none;stroke-linejoin:round;stroke-linecap:round}
