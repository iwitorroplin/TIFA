<text class="dg-small" x="56" y="265" text-anchor="end">50</text>
<text class="dg-small" x="56" y="67" text-anchor="end">117</text>
<text class="dg-small" x="536" y="334" text-anchor="end">min</text>
<line class="dg-guide" x1="60" y1="261" x2="540" y2="261"></line>
<text class="dg-label" x="160" y="255">umbral de ciclo (inicio y fin) · 50 °C</text>
<line class="dg-guide" x1="101.8" y1="261" x2="101.8" y2="150"></line>
<line class="dg-guide" x1="135.2" y1="65" x2="135.2" y2="326"></line>
<line class="dg-guide" x1="448.7" y1="64" x2="448.7" y2="326"></line>
<line class="dg-guide" x1="494.7" y1="264" x2="494.7" y2="326"></line>
